; Project-specific folders and optional integration; this file stays outside the addon.
[folders]
assets=PackedStringArray("res://")
templates=PackedStringArray("res://actors/assembly/templates")
save="res://actors"

[integration]
adapter="res://actors/assembly/project_adapter.gd"

[animation]
; Preserve existing Cruises animation names. New projects default to "workshop".
library="captain"
